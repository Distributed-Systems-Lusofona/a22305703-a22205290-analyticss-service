server:
  port: ${PORT:8091}

spring:
  application:
    name: ${APPLICATION_NAME:analytics-service}

  datasource:
    url: jdbc:postgresql://analytics_db:5432/${POSTGRES_DB:analytics_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    consumer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
      group-id: analytics-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
      auto-offset-reset: earliest

restaurant:
  service:
    url: ${RESTAURANT_SERVICE_URL:http://restaurant-service:8087}

kafka:
  topics:
    reservation-created: reservation.created
    reservation-confirmed: reservation.confirmed
    reservation-cancelled: reservation.cancelled
    restaurant-notified: restaurant.notified

logging:
  level:
    org.springframework.kafka: INFO
    feign: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
