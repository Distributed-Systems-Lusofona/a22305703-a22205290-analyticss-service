services:
  analytics_db:
    image: postgres:17
    restart: always
    env_file: ".env"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - store-network

  flyway:
    image: flyway/flyway:11.12
    depends_on:
      analytics_db:
        condition: service_healthy
    env_file: ".env"
    volumes:
      - ./migrations:/flyway/sql
    command: >
      -url=jdbc:postgresql://analytics_db:5432/$POSTGRES_DB
      -user=$POSTGRES_USER
      -password=$POSTGRES_PASSWORD
      migrate
    networks:
      - store-network

  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      analytics_db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    env_file: ".env"
    ports:
      - "8091:8091"
    volumes:
      - ./src:/app/src
      - ~/.m2:/root/.m2
    networks:
      - store-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8097:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
    networks:
      - store-network

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "8098:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data_analytics:/var/lib/pgadmin
    networks:
      - store-network

volumes:
  db_data:
  pgadmin_data_analytics:

networks:
  store-network:
    external: true
